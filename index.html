<style>:root{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;--dark:#231F20;--orange:#E07A35;--orange-d:#B85E22;--yellow:#F7E733;--red:#D0503B;--tare:#7A3B12;--tare-l:#F6E3D2;--shio:#2F6E8E;--shio-l:#E3EFF5;--ok:#4CAF7A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}}:root[data-theme="dark"]{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid var(--yellow);outline-offset:4px}.mode{display:none}.mode.on{display:block}.screen{display:none}.screen.on{display:block}body{height:100%}#m-order.on{display:flex;flex-direction:column;height:100%;overflow:hidden}.o-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:4px solid var(--orange)}.o-head h1{margin:0;font-size:clamp(30px,min(9vw,6.5vh),60px);font-weight:900;line-height:1.1;color:var(--dark);background:var(--orange);padding:2px 22px 6px;border-radius:999px;-webkit-text-stroke:.14em #fff;paint-order:stroke fill}.o-price{text-align:right;line-height:1.15}.o-price b{display:block;font-size:clamp(22px,min(6.5vw,4.6vh),42px);font-weight:900;color:var(--yellow)}.o-price span{font-size:clamp(16px,min(4.2vw,3vh),26px);font-weight:700}.o-main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1000px;margin:0 auto;padding:12px 16px 8px}#m-order .screen.on{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}.items{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);gap:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;border-radius:26px;background:var(--panel);border:5px solid var(--line);min-height:0}.item.has{border-color:var(--orange)}.item h2{margin:0;white-space:nowrap;font-size:clamp(34px,min(10vw,8vh),88px);font-weight:900;line-height:1;-webkit-text-stroke:.1em #fff;paint-order:stroke fill}.tare h2{color:var(--tare)}.shio h2{color:var(--shio)}@media (min-width:720px){.items{grid-template-columns:1fr 1fr}.item{flex-direction:column;justify-content:center;gap:min(4vh,28px)}.item h2{font-size:clamp(48px,min(8vw,13vh),120px)}.items .btn-c{width:min(10vw,15vh);height:min(10vw,15vh);font-size:min(6vw,9vh)}.items .num{font-size:min(8vw,13vh)}}.counter{display:flex;align-items:center;gap:clamp(6px,2vw,14px)}.btn-c{width:clamp(62px,min(17vw,10.5vh),112px);height:clamp(62px,min(17vw,10.5vh),112px);border-radius:50%;border:4px solid #fff;font-weight:900;font-size:clamp(38px,min(10vw,6.5vh),66px);line-height:1;color:var(--dark);background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}.btn-c:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-d)}.btn-c:disabled{background:var(--line);border-color:var(--line);color:var(--sub);box-shadow:none;cursor:default}.num{min-width:1.9em;text-align:center;font-size:clamp(44px,min(12vw,8.5vh),96px);font-weight:900;line-height:1}.num small{font-size:.4em;font-weight:700;margin-left:2px}.o-foot{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:720px){.o-foot{grid-template-columns:1fr 1fr;align-items:stretch}}.total{background:#fff;color:var(--dark);border-radius:22px;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap}.total .l{font-size:clamp(20px,min(5.5vw,3.6vh),30px);font-weight:700}.total .r{font-size:clamp(34px,min(9vw,6vh),54px);font-weight:900;line-height:1.1}.total .r small{font-size:.5em}.deal{width:100%;text-align:right;font-size:clamp(14px,min(4vw,2.4vh),20px);font-weight:700;color:var(--red);min-height:1.2em;line-height:1.2}.big{display:block;width:100%;padding:min(2.4vh,20px) 10px;border:5px solid #fff;border-radius:999px;font-weight:900;font-size:clamp(28px,min(8vw,5.5vh),46px);background:var(--orange);color:var(--dark);box-shadow:0 6px 0 var(--orange-d)}.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}.big:disabled{background:var(--line);border-color:var(--line);color:var(--sub);box-shadow:none;cursor:default}.big.ghost{background:transparent;color:#fff;border-color:var(--line);box-shadow:none}.lead{text-align:center;font-size:clamp(26px,min(7vw,5vh),44px);font-weight:900;margin:0}.check{flex:1;min-height:0;background:#fff;color:var(--dark);border-radius:26px;padding:0 26px;display:flex;flex-direction:column;justify-content:center}.row{display:flex;justify-content:space-between;align-items:center;padding:min(2vh,16px) 0;font-size:clamp(34px,min(9.5vw,7vh),68px);font-weight:900;line-height:1.1}.row+.row{border-top:4px dotted #D9CFC8}.row .t{color:var(--tare)}.row .s{color:var(--shio)}.row.sum{font-size:clamp(28px,min(7.5vw,5.5vh),52px)}.btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}.btns .big{font-size:clamp(22px,min(6vw,4.5vh),40px)}.msg{text-align:center;color:var(--yellow);font-size:18px;font-weight:700;margin:0;min-height:1.3em}.done{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(1.6vh,14px);text-align:center}.done .no{background:var(--orange);color:var(--dark);border:5px solid #fff;border-radius:28px;padding:min(1.5vh,12px) min(8vw,48px)}.done .no span{display:block;font-size:clamp(18px,min(5vw,3vh),28px);font-weight:700}.done .no b{display:block;font-size:clamp(80px,min(26vw,20vh),180px);line-height:1;font-weight:900;-webkit-text-stroke:.07em #fff;paint-order:stroke fill}.done p{font-size:clamp(20px,min(5.5vw,3.6vh),32px);font-weight:700;margin:0}.done .pay{font-size:clamp(30px,min(8.5vw,6vh),54px);font-weight:900;color:var(--yellow)}.pop{animation:pop .45s ease-out}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.o-legal{display:flex;align-items:center;gap:10px;padding:6px 16px 8px;font-size:11px;line-height:1.4;color:var(--sub);border-top:1px solid var(--line)}.o-legal p{margin:0;flex:1}.to-admin{background:none;border:1px solid var(--line);border-radius:999px;color:var(--sub);font-size:12px;padding:6px 12px;white-space:nowrap}</style>
</head>
<body>
<!-- ===================== ORDER ===================== -->
<div class="mode on" id="m-order">
  <header class="o-head">
    <h1>やきとり</h1>
    <div class="o-price"><b>2本 150円</b><span>1本 100円</span></div>
  </header>
  <main class="o-main">
    <section class="screen on" id="s-pick">
      <div class="items">
        <div class="item tare" id="card-tare">
          <h2>タレ</h2>
          <div class="counter">
            <button class="btn-c" data-k="tare" data-d="-1" aria-label="タレを へらす">−</button>
            <div class="num" id="n-tare" aria-live="polite">0<small>本</small></div>
            <button class="btn-c" data-k="tare" data-d="1" aria-label="タレを ふやす">＋</button>
          </div>
        </div>
        <div class="item shio" id="card-shio">
          <h2>しお</h2>
          <div class="counter">
            <button class="btn-c" data-k="shio" data-d="-1" aria-label="しおを へらす">−</button>
            <div class="num" id="n-shio" aria-live="polite">0<small>本</small></div>
            <button class="btn-c" data-k="shio" data-d="1" aria-label="しおを ふやす">＋</button>
          </div>
        </div>
      </div>
      <div class="o-foot">
        <div class="total" aria-live="polite">
          <span class="l" id="t-count">ぜんぶで 0本</span>
          <span class="r" id="t-price">0<small>円</small></span>
          <span class="deal" id="t-deal"></span>
        </div>
        <button class="big" id="b-next" disabled>ちゅうもん する</button>
      </div>
    </section>

    <section class="screen" id="s-check">
      <p class="lead">これで いいかな？</p>
      <div class="check" id="check"></div>
      <p class="msg" id="send-msg" role="status"></p>
      <div class="btns">
        <button class="big ghost" id="b-back">もどる</button>
        <button class="big" id="b-ok">おねがいします</button>
      </div>
    </section>

    <section class="screen" id="s-done">
      <div class="done">
        <p class="lead">ありがとう！</p>
        <div class="no pop" id="no-box"><span>ばんごう</span><b id="no">1</b></div>
        <p id="done-sum"></p>
        <p class="pay" id="done-pay"></p>
        <p>ばんごうを よばれたら とりに きてね</p>
      </div>
      <button class="big" id="b-new">つぎの ひと</button>
    </section>
  </main>
  <footer class="o-legal">
    <p>原材料に含まれるアレルギー物質：小麦・大豆・鶏肉　※本製品の製造ラインでは、卵、えび、牛肉、大豆、豚肉、りんご、ごまを含む製品を生産しています。</p>
    <button class="to-admin" id="go-admin">管理</button>
  </footer>
</div>
<script>const FIREBASE = {
apiKey: "AIzaSyDCxuCtMP3w649vIBKALgcGsE0Vo43hG_4",
projectId: "fks-ginnan"
};
const MAX = 10;
const $ = id => document.getElementById(id);
const price = n => Math.floor(n/2)*150 + (n%2)*100;
const USE_FB = !!(FIREBASE.apiKey && FIREBASE.projectId);
const Store = (() => {
const K = "ginnan-orders", NK = "ginnan-no";
let orders = [], fns = [], fb = null;
const emit = () => fns.forEach(f => f(orders));
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const loadLocal = () => { orders = lsGet(K, []).sort((a,b) => b.createdAt - a.createdAt); emit(); };
const DOCS = () => `projects/${FIREBASE.projectId}/databases/(default)/documents`;
const API = p => `https://firestore.googleapis.com/v1/${p}?key=${FIREBASE.apiKey}`;
async function post(path, body){
const r = await fetch(API(path), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
if (!r.ok) throw new Error("HTTP " + r.status);
return r.json();
}
const toFields = o => Object.fromEntries(Object.entries(o).map(([k,v]) =>
[k, typeof v === "number" ? { integerValue: String(v) } : { stringValue: String(v) }]));
async function nextNo(){
if (!USE_FB){ const n = lsGet(NK, 0) + 1; lsSet(NK, n); return n; }
const res = await post(DOCS() + ":commit", { writes: [{ transform: {
document: DOCS() + "/meta/counter",
fieldTransforms: [{ fieldPath: "n", increment: { integerValue: "1" } }] } }] });
return Number(res.writeResults[0].transformResults[0].integerValue);
}
async function add(o){
if (!USE_FB){ const l = lsGet(K, []); l.push({ id:"l"+Date.now()+Math.random().toString(36).slice(2,6), ...o }); lsSet(K, l); loadLocal(); return; }
await post(DOCS() + "/orders", { fields: toFields(o) });
}
async function init(status){
if (!USE_FB){
loadLocal();
addEventListener("storage", e => { if (e.key === K) loadLocal(); });
status(true, "このブラウザ内だけで同期中（Firebase未設定）");
return;
}
const V = "10.12.2";
const [{ initializeApp }, F] = await Promise.all([
import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
]);
const db = F.getFirestore(initializeApp({ apiKey: FIREBASE.apiKey, projectId: FIREBASE.projectId }));
fb = { F, db };
F.onSnapshot(F.query(F.collection(db, "orders"), F.orderBy("createdAt","desc"), F.limit(1000)), snap => {
orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
status(true, "リアルタイム更新中"); emit();
}, () => status(false, "接続できません。設定とルールを確認してください"));
}
async function setStatus(id, st){
const patch = { status: st, updatedAt: Date.now() };
if (!fb){ const l = lsGet(K, []); const o = l.find(x => x.id === id); if (o) Object.assign(o, patch); lsSet(K, l); loadLocal(); return; }
await fb.F.updateDoc(fb.F.doc(fb.db, "orders", id), patch);
}
async function reset(){
if (!fb){ lsSet(K, []); lsSet(NK, 0); loadLocal(); return; }
const { F, db } = fb; const ids = orders.map(o => o.id);
for (let i = 0; i < ids.length; i += 400){
const b = F.writeBatch(db); ids.slice(i, i+400).forEach(id => b.delete(F.doc(db, "orders", id))); await b.commit();
}
await F.setDoc(F.doc(db, "meta", "counter"), { n: 0 });
}
return { init, nextNo, add, setStatus, reset, onOrders: f => { fns.push(f); f(orders); } };
})();
const st = { tare:0, shio:0 };
function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function render(){
for (const k of ["tare","shio"]){
$("n-"+k).innerHTML = st[k] + "<small>本</small>";
$("card-"+k).classList.toggle("has", st[k] > 0);
document.querySelector(`.btn-c[data-k="${k}"][data-d="-1"]`).disabled = st[k] === 0;
document.querySelector(`.btn-c[data-k="${k}"][data-d="1"]`).disabled = st[k] >= MAX;
}
const n = st.tare + st.shio, p = price(n), save = n*100 - p;
$("t-count").textContent = "ぜんぶで " + n + "本";
$("t-price").innerHTML = p + "<small>円</small>";
$("t-deal").textContent = save > 0 ? "2本セットで " + save + "円 おとく！" : (n === 1 ? "もう1本で 50円 おとく！" : "");
$("b-next").disabled = n === 0;
}
document.querySelectorAll(".btn-c").forEach(b => b.addEventListener("click", () => {
const k = b.dataset.k; st[k] = Math.max(0, Math.min(MAX, st[k] + +b.dataset.d)); render();
}));
$("b-next").onclick = () => {
const n = st.tare + st.shio; let h = "";
if (st.tare) h += `<div class="row"><span class="t">タレ</span><span>${st.tare}本</span></div>`;
if (st.shio) h += `<div class="row"><span class="s">しお</span><span>${st.shio}本</span></div>`;
h += `<div class="row sum"><span>${n}本で</span><span>${price(n)}円</span></div>`;
$("check").innerHTML = h; $("send-msg").textContent = ""; show("s-check");
};
$("b-back").onclick = () => show("s-pick");
let sending = false;
$("b-ok").onclick = async () => {
if (sending) return; sending = true; $("b-ok").disabled = true; $("send-msg").textContent = "おくっています…";
try{
const n = st.tare + st.shio, no = await Store.nextNo();
const o = { no, tare:st.tare, shio:st.shio, count:n, price:price(n), status:"new", createdAt:Date.now(), updatedAt:Date.now() };
await Store.add(o);
$("no").textContent = no;
$("done-sum").textContent = [st.tare && "タレ " + st.tare + "本", st.shio && "しお " + st.shio + "本"].filter(Boolean).join("、");
$("done-pay").textContent = o.price + "円 です";
const box = $("no-box"); box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
show("s-done");
}catch(e){ $("send-msg").textContent = "おくれませんでした。おとなの人を よんでね"; }
finally{ sending = false; $("b-ok").disabled = false; }
};
$("b-new").onclick = () => { st.tare = 0; st.shio = 0; render(); show("s-pick"); };
$("go-admin").onclick = () => { location.href = "admin.html"; };
render();</script>
</body>
</html>
