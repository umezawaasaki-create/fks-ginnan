<style>:root{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;--dark:#231F20;--orange:#E07A35;--orange-d:#B85E22;--yellow:#F7E733;--red:#D0503B;--tare:#7A3B12;--tare-l:#F6E3D2;--shio:#2F6E8E;--shio-l:#E3EFF5;--ok:#4CAF7A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}}:root[data-theme="dark"]{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid var(--yellow);outline-offset:4px}.mode{display:none}.mode.on{display:block}.screen{display:none}.screen.on{display:block}.adm{max-width:1200px;margin:0 auto;padding:14px 16px 40px}.adm-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--orange)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}.adm-head h1{margin:0;font-size:30px;font-weight:900;color:var(--dark);-webkit-text-stroke:.14em #fff;paint-order:stroke fill;background:var(--orange);padding:4px 18px 6px;border-radius:999px}.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--sub);font-size:16px}.live i{width:12px;height:12px;border-radius:50%;background:var(--line)}.live.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(76,175,122,.25)}.adm-head .sp{flex:1}.tbtn{background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:700}.tbtn.warn{border-color:var(--red);color:#FFB3A6}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);gap:12px;margin:16px 0 20px}@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child{grid-column:1/-1}}.stat{background:var(--panel);border-radius:22px;padding:18px 22px 16px}.stat span{display:block;font-size:clamp(18px,1.9vw,24px);color:var(--sub);font-weight:700;margin-bottom:4px}.stat b{font-size:clamp(44px,5vw,84px);font-weight:900;line-height:1.05;white-space:nowrap}.stat b small{font-size:.5em;margin-left:2px}.stat.hl{background:var(--orange);color:var(--dark)}.stat.hl span{color:var(--dark)}.stat.t b{color:#F0A56E}.stat.s b{color:#8FCBE8}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media (max-width:900px){.cols{grid-template-columns:1fr}}.col h2{margin:0 0 10px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}.col h2 em{font-style:normal;background:#fff;color:var(--dark);border-radius:999px;padding:0 12px;font-size:18px}.col.new h2{color:var(--yellow)}.col.ready h2{color:var(--orange)}.col.handed h2{color:var(--sub)}.list{display:flex;flex-direction:column;gap:10px}.empty{color:var(--sub);background:var(--panel);border-radius:16px;padding:18px;text-align:center;font-size:16px}.ord{background:#fff;color:var(--dark);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}.ord.fresh{animation:flash 1.6s ease-out}@keyframes flash{0%{box-shadow:0 0 0 0 var(--yellow)}30%{box-shadow:0 0 0 8px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}.ord .n{grid-row:span 2;font-size:44px;font-weight:900;line-height:1;background:var(--orange);border-radius:14px;padding:6px 12px;min-width:2.1em;text-align:center}.ord .q{font-size:22px;font-weight:900;display:flex;gap:14px;flex-wrap:wrap}.ord .q .t{color:var(--tare)}.ord .q .s{color:var(--shio)}.ord .m{font-size:15px;color:#6E625C;font-weight:700}.ord .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}.ord .acts button{flex:1;border-radius:12px;padding:12px 8px;font-size:18px;font-weight:900;border:none}.ord .go{background:var(--dark);color:#fff}.ord .back{flex:0 0 auto !important;background:#EDE6E1;color:var(--dark)}.col.handed .ord{opacity:.7}.note{color:var(--sub);font-size:14px;margin-top:18px}@media (prefers-reduced-motion:reduce){.pop,.ord.fresh{animation:none}}.bk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;background:var(--panel);border-radius:16px;padding:10px 14px}.bk-label{font-weight:900;font-size:16px;background:#fff;color:var(--dark);border-radius:999px;padding:2px 12px}.bk-st{font-size:15px;font-weight:700;color:var(--sub)}.bk-st.ok{color:#8FE0B0}.bk-st.warn{color:#FFB3A6}.bk .sp{flex:1}dialog{max-width:560px;width:calc(100% - 32px);border:none;border-radius:24px;padding:22px 24px;background:#fff;color:var(--dark);font-family:inherit}dialog::backdrop{background:rgba(0,0,0,.6)}dialog h2{margin:0 0 4px;font-size:24px}dialog h3{margin:0 0 6px;font-size:17px}dialog section{border-top:2px solid #EDE6E1;padding:14px 0}dialog p{margin:0 0 8px;font-size:15px}.dl-sub{color:#6E625C}dialog .tbtn{background:#EDE6E1;color:var(--dark);border-color:#EDE6E1}dialog .tbtn.go{background:var(--orange);border-color:var(--orange)}dialog .tbtn:disabled{opacity:.4;cursor:default}.dl-preview{background:#FFF4E8;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:700;margin-bottom:12px}.dl-acts{display:flex;justify-content:flex-end;gap:10px}</style>

<body>
<!-- ===================== ADMIN ===================== -->
<div class="mode on" id="m-admin">
  <div class="adm">
    <div class="adm-head">
      <h1>やきとり 管理</h1>
      <span class="live" id="live"><i></i><span id="live-t">接続中…</span></span>
      <span class="sp"></span>
      <button class="tbtn" id="go-order">注文画面へ</button>
      <button class="tbtn" id="b-csv">集計を保存（Excel用）</button>
      <button class="tbtn warn" id="b-reset">データをリセット</button>
    </div>
    <div class="bk">
      <span class="bk-label">バックアップ</span>
      <span class="bk-st" id="bk-st">この端末に自動で保存しています</span>
      <span class="sp"></span>
      <button class="tbtn" id="b-auto">Excelファイルに自動保存</button>
      <button class="tbtn" id="b-restore">復元</button>
    </div>
    <div class="stats">
      <div class="stat hl"><span>つくる待ち</span><b id="st-wait">0<small>件</small></b></div>
      <div class="stat t"><span>タレ 合計</span><b id="st-tare">0<small>本</small></b></div>
      <div class="stat s"><span>しお 合計</span><b id="st-shio">0<small>本</small></b></div>
      <div class="stat"><span>注文数</span><b id="st-cnt">0<small>件</small></b></div>
      <div class="stat"><span>売上</span><b id="st-sales">0<small>円</small></b></div>
    </div>
    <div class="cols">
      <div class="col new"><h2>つくる <em id="c-new">0</em></h2><div class="list" id="l-new"></div></div>
      <div class="col ready"><h2>できた・よびだし <em id="c-ready">0</em></h2><div class="list" id="l-ready"></div></div>
      <div class="col handed"><h2>わたした <em id="c-handed">0</em></h2><div class="list" id="l-handed"></div></div>
    </div>
    <p class="note" id="adm-note"></p>
    <dialog id="dlg">
      <h2>データを復元</h2>
      <p class="dl-sub">今のデータにない注文だけを追加します。すでにある注文は重複しません。</p>
      <section>
        <h3>この端末のバックアップ（リセット前の状態）</h3>
        <p id="dl-local">ありません</p>
        <button class="tbtn" id="dl-use-local" hidden>このバックアップを使う</button>
      </section>
      <section>
        <h3>保存したExcel（CSV）ファイルから</h3>
        <input type="file" id="dl-file" accept=".csv,text/csv">
      </section>
      <div class="dl-preview" id="dl-preview" hidden></div>
      <div class="dl-acts">
        <button class="tbtn" id="dl-close">閉じる</button>
        <button class="tbtn go" id="dl-run" disabled>この内容を復元</button>
      </div>
    </dialog>
  </div>
</div>
<script>const FIREBASE = {
apiKey: "AIzaSyDCxuCtMP3w649vIBKALgcGsE0Vo43hG_4",
projectId: "fks-ginnan"
};
const MAX = 10;
const $ = id => document.getElementById(id);
const price = n => Math.floor(n/2)*150 + (n%2)*100;
const USE_FB = !!(FIREBASE.apiKey && FIREBASE.projectId);
const Store = (() => {
const K = "ginnan-orders", NK = "ginnan-no";
let orders = [], fns = [], fb = null, loaded = false;
const emit = () => fns.forEach(f => f(orders));
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const loadLocal = () => { orders = lsGet(K, []).sort((a,b) => b.createdAt - a.createdAt); emit(); };
const DOCS = () => `projects/${FIREBASE.projectId}/databases/(default)/documents`;
const API = p => `https://firestore.googleapis.com/v1/${p}?key=${FIREBASE.apiKey}`;
async function post(path, body){
const r = await fetch(API(path), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
if (!r.ok) throw new Error("HTTP " + r.status);
return r.json();
}
const toFields = o => Object.fromEntries(Object.entries(o).map(([k,v]) =>
[k, typeof v === "number" ? { integerValue: String(v) } : { stringValue: String(v) }]));
async function nextNo(){
if (!USE_FB){ const n = lsGet(NK, 0) + 1; lsSet(NK, n); return n; }
const res = await post(DOCS() + ":commit", { writes: [{ transform: {
document: DOCS() + "/meta/counter",
fieldTransforms: [{ fieldPath: "n", increment: { integerValue: "1" } }] } }] });
return Number(res.writeResults[0].transformResults[0].integerValue);
}
async function add(o){
if (!USE_FB){ const l = lsGet(K, []); l.push({ id:"l"+Date.now()+Math.random().toString(36).slice(2,6), ...o }); lsSet(K, l); loadLocal(); return; }
await post(DOCS() + "/orders", { fields: toFields(o) });
}
async function init(status){
if (!USE_FB){
loaded = true; loadLocal();
addEventListener("storage", e => { if (e.key === K) loadLocal(); });
status(true, "このブラウザ内だけで同期中（Firebase未設定）");
return;
}
const V = "10.12.2";
const [{ initializeApp }, F] = await Promise.all([
import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
]);
const db = F.getFirestore(initializeApp({ apiKey: FIREBASE.apiKey, projectId: FIREBASE.projectId }));
fb = { F, db };
F.onSnapshot(F.query(F.collection(db, "orders"), F.orderBy("createdAt","desc"), F.limit(1000)), snap => {
orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
loaded = true; status(true, "リアルタイム更新中"); emit();
}, () => status(false, "接続できません。設定とルールを確認してください"));
}
async function setStatus(id, st){
const patch = { status: st, updatedAt: Date.now() };
if (!fb){ const l = lsGet(K, []); const o = l.find(x => x.id === id); if (o) Object.assign(o, patch); lsSet(K, l); loadLocal(); return; }
await fb.F.updateDoc(fb.F.doc(fb.db, "orders", id), patch);
}
async function reset(){
if (!fb){ lsSet(K, []); lsSet(NK, 0); loadLocal(); return; }
const { F, db } = fb; const ids = orders.map(o => o.id);
for (let i = 0; i < ids.length; i += 400){
const b = F.writeBatch(db); ids.slice(i, i+400).forEach(id => b.delete(F.doc(db, "orders", id))); await b.commit();
}
await F.setDoc(F.doc(db, "meta", "counter"), { n: 0 });
}
async function restore(list){
const key = o => o.no + "|" + o.createdAt;
const have = new Set(orders.map(key));
const add = list.filter(o => !have.has(key(o)));
const maxNo = Math.max(0, ...list.map(o => o.no), ...orders.map(o => o.no || 0));
if (!fb){
const l = lsGet(K, []);
add.forEach(o => l.push({ id:"r"+Date.now()+Math.random().toString(36).slice(2,6), ...o }));
lsSet(K, l); if (lsGet(NK, 0) < maxNo) lsSet(NK, maxNo); loadLocal(); return add.length;
}
const { F, db } = fb; const later = [];
for (let i = 0; i < add.length; i += 200){
const b = F.writeBatch(db);
add.slice(i, i+200).forEach(o => {
const ref = F.doc(F.collection(db, "orders"));
b.set(ref, { ...o, status: "new" });           // ルール上、作成は「つくる」状態で
if (o.status !== "new") later.push([ref, o.status]);
});
await b.commit();
}
for (let i = 0; i < later.length; i += 200){       // そのあと元の状態に戻す
const b = F.writeBatch(db);
later.slice(i, i+200).forEach(([ref, st]) => b.update(ref, { status: st, updatedAt: Date.now() }));
await b.commit();
}
const c = await F.getDoc(F.doc(db, "meta", "counter"));
if (((c.exists() && c.data().n) || 0) < maxNo) await F.setDoc(F.doc(db, "meta", "counter"), { n: maxNo });
return add.length;
}
return { init, nextNo, add, setStatus, reset, restore, get loaded(){ return loaded; },
onOrders: f => { fns.push(f); f(orders); } };
})();
const seen = new Set(); let firstLoad = true;
const hhmm = t => { const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(o){
const fresh = !firstLoad && !seen.has(o.id) ? " fresh" : "";
const q = (o.tare ? `<span class="t">タレ ${o.tare}本</span>` : "") + (o.shio ? `<span class="s">しお ${o.shio}本</span>` : "");
const id = esc(o.id); let a;
if (o.status === "new") a = `<button class="go" data-id="${id}" data-s="ready">やけた → よびだし</button>`;
else if (o.status === "ready") a = `<button class="back" data-id="${id}" data-s="new">もどす</button><button class="go" data-id="${id}" data-s="handed">わたした</button>`;
else a = `<button class="back" data-id="${id}" data-s="ready">もどす</button>`;
return `<div class="ord${fresh}"><div class="n">${esc(o.no)}</div><div class="q">${q}</div><div class="m">${esc(o.price)}円 ・ ${hhmm(o.createdAt)}</div><div class="acts">${a}</div></div>`;
}
const EMPTY = { new:"新しい注文はまだありません", ready:"できた注文はありません", handed:"まだありません" };
function renderAdmin(list){
const by = { new:[], ready:[], handed:[] };
list.forEach(o => (by[o.status] || by.new).push(o));
by.new.sort((a,b) => a.createdAt - b.createdAt); by.ready.sort((a,b) => a.createdAt - b.createdAt);
by.handed.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
for (const k in by){ $("l-"+k).innerHTML = by[k].length ? by[k].map(card).join("") : `<div class="empty">${EMPTY[k]}</div>`; $("c-"+k).textContent = by[k].length; }
const sum = f => list.reduce((a,o) => a + (o[f]||0), 0);
$("st-wait").innerHTML = by.new.length + "<small>件</small>";
$("st-tare").innerHTML = sum("tare") + "<small>本</small>";
$("st-shio").innerHTML = sum("shio") + "<small>本</small>";
$("st-cnt").innerHTML = list.length + "<small>件</small>";
$("st-sales").innerHTML = sum("price").toLocaleString() + "<small>円</small>";
list.forEach(o => seen.add(o.id));
}
document.querySelector(".cols").addEventListener("click", async e => {
const b = e.target.closest("button[data-id]"); if (!b) return; b.disabled = true;
try { await Store.setStatus(b.dataset.id, b.dataset.s); } catch(err){ $("adm-note").textContent = "更新できませんでした。"; b.disabled = false; }
});
$("b-reset").onclick = async () => {
if (!confirm("すべての注文を削除し、番号を1から始め直します。\n集計を保存していない場合は、先に「集計を保存」を押してください。\n\nリセットしてよろしいですか？")) return;
$("b-reset").disabled = true;
try { await Store.reset(); $("adm-note").textContent = "リセットしました。"; } catch(e){ $("adm-note").textContent = "リセットできませんでした。"; }
$("b-reset").disabled = false;
};
$("go-order").onclick = () => { location.href = "index.html"; };
const live = (on, t) => { $("live").classList.toggle("on", on); $("live-t").textContent = t; };
live(false, "接続中…");
Store.onOrders(list => { renderAdmin(list); if (list.length) firstLoad = false; });
Store.init((on, t) => { live(on, t); setTimeout(() => { firstLoad = false; }, 0); }).catch(() => live(false, "読み込みに失敗しました。通信を確認してください"));
let current = [];
Store.onOrders(list => { current = list; });
const STATUS = { new:"つくる", ready:"できた", handed:"わたした" };
const pad = n => String(n).padStart(2,"0");
const fmtDT = d => `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function csvCell(v){ const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function buildCsv(list){
const now = new Date(), rows = [];
const sum = f => list.reduce((a,o) => a + (o[f]||0), 0);
const handed = list.filter(o => o.status === "handed").length;
rows.push(["やきとり 売上集計"]);
rows.push(["出力日時", `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`]);
rows.push([]);
rows.push(["■ 合計"]);
rows.push(["注文件数", list.length]);
rows.push(["タレ（本）", sum("tare")]);
rows.push(["しお（本）", sum("shio")]);
rows.push(["合計本数（本）", sum("count")]);
rows.push(["売上（円）", sum("price")]);
rows.push(["受け渡し済み（件）", handed]);
rows.push(["未受け渡し（件）", list.length - handed]);
rows.push([]);
rows.push(["■ 時間帯別"]);
rows.push(["時間帯", "注文件数", "タレ（本）", "しお（本）", "売上（円）"]);
const hours = {};
list.forEach(o => { const h = new Date(o.createdAt).getHours(); const r = hours[h] ||= { c:0, t:0, s:0, p:0 }; r.c++; r.t += o.tare||0; r.s += o.shio||0; r.p += o.price||0; });
Object.keys(hours).map(Number).sort((a,b) => a-b).forEach(h => { const r = hours[h]; rows.push([`${h}:00〜${h}:59`, r.c, r.t, r.s, r.p]); });
rows.push([]);
rows.push(["■ 注文一覧"]);
rows.push(["番号", "注文日時", "タレ（本）", "しお（本）", "本数", "金額（円）", "状態"]);
[...list].sort((a,b) => a.createdAt - b.createdAt).forEach(o => {
const d = new Date(o.createdAt);
rows.push([o.no, fmtDT(d), o.tare||0, o.shio||0, o.count||0, o.price||0, STATUS[o.status] || o.status]);
});
return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
$("b-csv").onclick = () => {
if (!current.length){ $("adm-note").textContent = "まだ注文がありません。"; return; }
const d = new Date();
const name = `やきとり集計_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
const url = URL.createObjectURL(new Blob([buildCsv(current)], { type: "text/csv;charset=utf-8" }));
const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
setTimeout(() => URL.revokeObjectURL(url), 1000);
$("adm-note").textContent = name + " を保存しました。Excelで開いて印刷できます。";
};
const BK = "ginnan-backup", BKP = "ginnan-backup-prev";
const okey = o => o.no + "|" + o.createdAt;
const FIELDS = ["no","tare","shio","count","price","status","createdAt","updatedAt"];
const strip = o => Object.fromEntries(FIELDS.map(k => [k, o[k] ?? (k === "updatedAt" ? o.createdAt : 0)]));
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const summary = l => `${l.length}件・${l.reduce((a,o) => a + (o.count||0), 0)}本・${l.reduce((a,o) => a + (o.price||0), 0).toLocaleString()}円`;
const bkSt = (t, cls = "") => { const e = $("bk-st"); e.textContent = t; e.className = "bk-st " + cls; };
function backupLocal(list){
const cur = jget(BK, { orders: [] });
const now = new Set(list.map(okey));
if (cur.orders.length && cur.orders.some(o => !now.has(okey(o)))) jset(BKP, { ...cur, movedAt: Date.now() });
jset(BK, { orders: list.map(strip), savedAt: Date.now() });
}
const FS_OK = "showSaveFilePicker" in window;
let fh = null, fileKeys = null, writing = false, again = false, paused = false;
const idb = (mode, fn) => new Promise((res, rej) => {
const r = indexedDB.open("ginnan", 1);
r.onupgradeneeded = () => r.result.createObjectStore("kv");
r.onsuccess = () => { const tx = r.result.transaction("kv", mode); const q = fn(tx.objectStore("kv")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
r.onerror = () => rej(r.error);
});
const saveHandle = h => idb("readwrite", s => s.put(h, "file")).catch(() => {});
const loadHandle = () => idb("readonly", s => s.get("file")).catch(() => null);
async function writeFile(){
if (!fh || paused) return;
if (writing){ again = true; return; }
writing = true;
try{
const list = current;
if (fileKeys && [...fileKeys].some(k => !list.some(o => okey(o) === k))){
paused = true;
bkSt(`注文が減ったため、ファイル「${fh.name}」への上書きを止めました（ファイルの中身は守られています）`, "warn");
$("b-auto").textContent = "新しいファイルで自動保存";
return;
}
const w = await fh.createWritable(); await w.write(buildCsv(list)); await w.close();
fileKeys = new Set(list.map(okey));
bkSt(`「${fh.name}」に自動保存中（最終保存 ${hm(Date.now())}・${summary(list)}）`, "ok");
}catch(e){
bkSt("ファイルに保存できませんでした。「Excelファイルに自動保存」を押し直してください", "warn");
fh = null;
}finally{
writing = false;
if (again){ again = false; writeFile(); }
}
}
let tmr = null;
const queueWrite = () => { clearTimeout(tmr); tmr = setTimeout(writeFile, 700); };
async function startNewFile(){
const d = new Date();
const h = await window.showSaveFilePicker({
suggestedName: `やきとり集計_自動保存_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`,
types: [{ description: "CSV（Excelで開けます）", accept: { "text/csv": [".csv"] } }]
});
fh = h; fileKeys = null; paused = false; await saveHandle(h);
$("b-auto").textContent = "保存先を変更";
await writeFile();
}
async function resumeFile(h){
if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") return false;
const inFile = parseCsv(await (await h.getFile()).text()) || [];
const now = new Set(current.map(okey));
fh = h; fileKeys = new Set(inFile.map(okey)); paused = false;
if (inFile.some(o => !now.has(okey(o)))){
paused = true;
bkSt(`「${h.name}」には今のデータにない注文が ${inFile.filter(o => !now.has(okey(o))).length}件あります。上書きせずに止めています。「復元」から読み込めます`, "warn");
$("b-auto").textContent = "新しいファイルで自動保存";
return true;
}
$("b-auto").textContent = "保存先を変更";
await writeFile(); return true;
}
let pending = null;
$("b-auto").onclick = async () => {
if (!FS_OK){ bkSt("このブラウザはファイルへの自動保存に対応していません。パソコンのChromeかEdgeで開いてください（この端末への自動保存は続いています）", "warn"); return; }
try{
if (pending && !fh){ const h = pending; pending = null; if (await resumeFile(h)) return; }
await startNewFile();
}catch(e){ if (e && e.name !== "AbortError") bkSt("ファイルを設定できませんでした", "warn"); }
};
function splitCsv(text){
const rows = []; let row = [], f = "", q = false;
text = text.replace(/^\uFEFF/, "");
for (let i = 0; i < text.length; i++){
const c = text[i];
if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
else if (c === '"') q = true;
else if (c === ","){ row.push(f); f = ""; }
else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
else f += c;
}
if (f || row.length){ row.push(f); rows.push(row); }
return rows;
}
const ST_BACK = { "つくる":"new", "できた":"ready", "わたした":"handed" };
function parseCsv(text){
const rows = splitCsv(text);
const s = rows.findIndex(r => (r[0] || "").includes("注文一覧"));
if (s < 0 || !rows[s+1]) return null;
const head = rows[s+1].map(h => h.trim());
const col = name => head.findIndex(h => h.startsWith(name));
const ci = { no: col("番号"), dt: col("注文日時"), t: col("タレ"), s: col("しお"), p: col("金額"), st: col("状態") };
if (ci.no < 0 || ci.dt < 0 || ci.t < 0 || ci.s < 0) return null;
const out = [];
for (const r of rows.slice(s+2)){
if (!r[ci.no] || !/^\d+$/.test(r[ci.no].trim())) break;
const m = (r[ci.dt] || "").match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
if (!m) continue;
const createdAt = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0)).getTime();
const tare = Math.min(MAX, Math.max(0, parseInt(r[ci.t],10) || 0)), shio = Math.min(MAX, Math.max(0, parseInt(r[ci.s],10) || 0));
const count = tare + shio; if (!count) continue;
const p = ci.p >= 0 ? parseInt(String(r[ci.p]).replace(/[^\d]/g,""),10) : NaN;
out.push({ no: +r[ci.no], tare, shio, count, price: Number.isFinite(p) ? p : price(count),
status: ST_BACK[(r[ci.st] || "").trim()] || "handed", createdAt, updatedAt: createdAt });
}
return out;
}
let cand = null;
function preview(list, from){
cand = list;
const now = new Set(current.map(okey));
const add = list.filter(o => !now.has(okey(o)));
$("dl-preview").hidden = false;
$("dl-preview").innerHTML = `${esc(from)}：${esc(summary(list))}<br>このうち今のデータにない注文：<b>${add.length}件</b>（${esc(summary(add))}）`;
$("dl-run").disabled = add.length === 0;
}
$("b-restore").onclick = () => {
const p = jget(BKP, null);
cand = null; $("dl-preview").hidden = true; $("dl-run").disabled = true; $("dl-file").value = "";
if (p && p.orders && p.orders.length){
$("dl-local").textContent = `${summary(p.orders)}（${hm(p.movedAt || p.savedAt)} 時点）`;
$("dl-use-local").hidden = false;
} else { $("dl-local").textContent = "ありません"; $("dl-use-local").hidden = true; }
$("dlg").showModal();
};
$("dl-use-local").onclick = () => { const p = jget(BKP, null); if (p) preview(p.orders, "この端末のバックアップ"); };
$("dl-file").onchange = async e => {
const f = e.target.files[0]; if (!f) return;
const list = parseCsv(await f.text());
if (!list){ $("dl-preview").hidden = false; $("dl-preview").textContent = "このファイルは読み込めませんでした。管理画面で保存したCSVファイルを選んでください。"; $("dl-run").disabled = true; return; }
preview(list, f.name);
};
$("dl-close").onclick = () => $("dlg").close();
$("dl-run").onclick = async () => {
if (!cand) return;
$("dl-run").disabled = true; $("dl-run").textContent = "復元しています…";
try{
const n = await Store.restore(cand);
$("adm-note").textContent = `${n}件の注文を復元しました。`;
$("dlg").close();
}catch(e){ $("dl-preview").textContent = "復元できませんでした。通信を確認して、もう一度お試しください。"; }
$("dl-run").textContent = "この内容を復元";
};
Store.onOrders(list => {
if (!Store.loaded) return;
backupLocal(list);
if (fh && paused && fileKeys && [...fileKeys].every(k => list.some(o => okey(o) === k))){
paused = false; $("b-auto").textContent = "保存先を変更";   // 復元などで元に戻ったら自動保存を再開
}
if (fh) queueWrite();
else if (!pending) bkSt(`この端末に自動で保存しています（${hm(Date.now())}・${summary(list)}）`);
});
(async () => {
if (!FS_OK) return;
const h = await loadHandle();
if (h){ pending = h; $("b-auto").textContent = `「${h.name}」への自動保存を再開`; bkSt("前回のExcelファイルへの自動保存を再開するには、右のボタンを押してください", "warn"); }
})();</script>
