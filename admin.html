<style>:root{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;--dark:#231F20;--orange:#E07A35;--orange-d:#B85E22;--yellow:#F7E733;--red:#D0503B;--tare:#7A3B12;--tare-l:#F6E3D2;--shio:#2F6E8E;--shio-l:#E3EFF5;--ok:#4CAF7A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}}:root[data-theme="dark"]{--bg:#231F20;--panel:#2E292A;--line:#4A4344;--ink:#FFFFFF;--sub:#C9BFB9;}*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:5px solid var(--yellow);outline-offset:4px}.mode{display:none}.mode.on{display:block}.screen{display:none}.screen.on{display:block}.adm{max-width:1200px;margin:0 auto;padding:14px 16px 40px}.adm-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--orange)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}.adm-head h1{margin:0;font-size:30px;font-weight:900;color:var(--dark);-webkit-text-stroke:.14em #fff;paint-order:stroke fill;background:var(--orange);padding:4px 18px 6px;border-radius:999px}.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--sub);font-size:16px}.live i{width:12px;height:12px;border-radius:50%;background:var(--line)}.live.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(76,175,122,.25)}.adm-head .sp{flex:1}.tbtn{background:var(--panel);color:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:700}.tbtn.warn{border-color:var(--red);color:#FFB3A6}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}.stat{background:var(--panel);border-radius:18px;padding:12px 14px}.stat span{display:block;font-size:15px;color:var(--sub);font-weight:700}.stat b{font-size:34px;font-weight:900}.stat b small{font-size:.5em;margin-left:2px}.stat.hl{background:var(--orange);color:var(--dark)}.stat.hl span{color:var(--dark)}.stat.t b{color:#F0A56E}.stat.s b{color:#8FCBE8}.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media (max-width:900px){.cols{grid-template-columns:1fr}}.col h2{margin:0 0 10px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}.col h2 em{font-style:normal;background:#fff;color:var(--dark);border-radius:999px;padding:0 12px;font-size:18px}.col.new h2{color:var(--yellow)}.col.ready h2{color:var(--orange)}.col.handed h2{color:var(--sub)}.list{display:flex;flex-direction:column;gap:10px}.empty{color:var(--sub);background:var(--panel);border-radius:16px;padding:18px;text-align:center;font-size:16px}.ord{background:#fff;color:var(--dark);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}.ord.fresh{animation:flash 1.6s ease-out}@keyframes flash{0%{box-shadow:0 0 0 0 var(--yellow)}30%{box-shadow:0 0 0 8px var(--yellow)}100%{box-shadow:0 0 0 0 transparent}}.ord .n{grid-row:span 2;font-size:44px;font-weight:900;line-height:1;background:var(--orange);border-radius:14px;padding:6px 12px;min-width:2.1em;text-align:center}.ord .q{font-size:22px;font-weight:900;display:flex;gap:14px;flex-wrap:wrap}.ord .q .t{color:var(--tare)}.ord .q .s{color:var(--shio)}.ord .m{font-size:15px;color:#6E625C;font-weight:700}.ord .acts{grid <body>
<!-- ===================== ADMIN ===================== -->
<div class="mode on" id="m-admin">
  <div class="adm">
    <div class="adm-head">
      <h1>やきとり 管理</h1>
      <span class="live" id="live"><i></i><span id="live-t">接続中…</span></span>
      <span class="sp"></span>
      <button class="tbtn" id="go-order">注文画面へ</button>
      <button class="tbtn" id="b-csv">集計を保存（Excel用）</button>
      <button class="tbtn" id="b-restore">Excelから復元</button>
      <input type="file" id="f-restore" accept=".xlsx" hidden>
      <button class="tbtn warn" id="b-reset">データをリセット</button>
    </div>
    <div class="stats">
      <div class="stat hl"><span>つくる待ち</span><b id="st-wait">0<small>件</small></b></div>
      <div class="stat t"><span>タレ 合計</span><b id="st-tare">0<small>本</small></b></div>
      <div class="stat s"><span>しお 合計</span><b id="st-shio">0<small>本</small></b></div>
      <div class="stat"><span>注文数</span><b id="st-cnt">0<small>件</small></b></div>
      <div class="stat"><span>売上</span><b id="st-sales">0<small>円</small></b></div>
    </div>
    <div class="cols">
      <div class="col new"><h2>つくる <em id="c-new">0</em></h2><div class="list" id="l-new"></div></div>
      <div class="col ready"><h2>できた・よびだし <em id="c-ready">0</em></h2><div class="list" id="l-ready"></div></div>
      <div class="col handed"><h2>わたした <em id="c-handed">0</em></h2><div class="list" id="l-handed"></div></div>
    </div>
    <p class="note" id="adm-note"></p>
  </div>
</div>
<script>const FIREBASE = {
apiKey: "AIzaSyDCxuCtMP3w649vIBKALgcGsE0Vo43hG_4",
projectId: "fks-ginnan"
};
const MAX = 10;
const $ = id => document.getElementById(id);
const price = n => Math.floor(n/2)*150 + (n%2)*100;
const USE_FB = !!(FIREBASE.apiKey && FIREBASE.projectId);
const Store = (() => {
const K = "ginnan-orders", NK = "ginnan-no";
let orders = [], fns = [], fb = null;
const emit = () => fns.forEach(f => f(orders));
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const loadLocal = () => { orders = lsGet(K, []).sort((a,b) => b.createdAt - a.createdAt); emit(); };
const DOCS = () => `projects/${FIREBASE.projectId}/databases/(default)/documents`;
const API = p => `https://firestore.googleapis.com/v1/${p}?key=${FIREBASE.apiKey}`;
async function post(path, body){
const r = await fetch(API(path), { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
if (!r.ok) throw new Error("HTTP " + r.status);
return r.json();
}
const toFields = o => Object.fromEntries(Object.entries(o).map(([k,v]) =>
[k, typeof v === "number" ? { integerValue: String(v) } : { stringValue: String(v) }]));
async function nextNo(){
if (!USE_FB){ const n = lsGet(NK, 0) + 1; lsSet(NK, n); return n; }
const res = await post(DOCS() + ":commit", { writes: [{ transform: {
document: DOCS() + "/meta/counter",
fieldTransforms: [{ fieldPath: "n", increment: { integerValue: "1" } }] } }] });
return Number(res.writeResults[0].transformResults[0].integerValue);
}
async function add(o){
if (!USE_FB){ const l = lsGet(K, []); l.push({ id:"l"+Date.now()+Math.random().toString(36).slice(2,6), ...o }); lsSet(K, l); loadLocal(); return; }
await post(DOCS() + "/orders", { fields: toFields(o) });
}
async function init(status){
if (!USE_FB){
loadLocal();
addEventListener("storage", e => { if (e.key === K) loadLocal(); });
status(true, "このブラウザ内だけで同期中（Firebase未設定）");
return;
}
const V = "10.12.2";
const [{ initializeApp }, F] = await Promise.all([
import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
]);
const db = F.getFirestore(initializeApp({ apiKey: FIREBASE.apiKey, projectId: FIREBASE.projectId }));
fb = { F, db };
F.onSnapshot(F.query(F.collection(db, "orders"), F.orderBy("createdAt","desc"), F.limit(1000)), snap => {
orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
status(true, "リアルタイム更新中"); emit();
}, () => status(false, "接続できません。設定とルールを確認してください"));
}
async function setStatus(id, st){
const patch = { status: st, updatedAt: Date.now() };
if (!fb){ const l = lsGet(K, []); const o = l.find(x => x.id === id); if (o) Object.assign(o, patch); lsSet(K, l); loadLocal(); return; }
await fb.F.updateDoc(fb.F.doc(fb.db, "orders", id), patch);
}
async function reset(){
if (!fb){ lsSet(K, []); lsSet(NK, 0); loadLocal(); return; }
const { F, db } = fb; const ids = orders.map(o => o.id);
for (let i = 0; i < ids.length; i += 400){
const b = F.writeBatch(db); ids.slice(i, i+400).forEach(id => b.delete(F.doc(db, "orders", id))); await b.commit();
}
await F.setDoc(F.doc(db, "meta", "counter"), { n: 0 });
}
async function restore(list){
const now = Date.now(), maxNo = Math.max(0, ...list.map(o => o.no));
if (!fb){
const l = lsGet(K, []); list.forEach(({ id, ...o }) => l.push({ id, ...o, updatedAt: now })); lsSet(K, l);
if (maxNo > lsGet(NK, 0)) lsSet(NK, maxNo); loadLocal(); return;
}
const { F, db } = fb;
for (let i = 0; i < list.length; i += 400){
const b = F.writeBatch(db); list.slice(i, i+400).forEach(({ id, ...o }) => b.set(F.doc(db, "orders", id), { ...o, updatedAt: now })); await b.commit();
}
const c = await F.getDoc(F.doc(db, "meta", "counter"));
if (maxNo > (c.exists() ? c.data().n : 0)) await F.setDoc(F.doc(db, "meta", "counter"), { n: maxNo });
}
return { init, nextNo, add, setStatus, reset, restore, onOrders: f => { fns.push(f); f(orders); } };
})();
const seen = new Set(); let firstLoad = true;
const hhmm = t => { const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function card(o){
const fresh = !firstLoad && !seen.has(o.id) ? " fresh" : "";
const q = (o.tare ? `<span class="t">タレ ${o.tare}本</span>` : "") + (o.shio ? `<span class="s">しお ${o.shio}本</span>` : "");
const id = esc(o.id); let a;
if (o.status === "new") a = `<button class="go" data-id="${id}" data-s="ready">やけた → よびだし</button>`;
else if (o.status === "ready") a = `<button class="back" data-id="${id}" data-s="new">もどす</button><button class="go" data-id="${id}" data-s="handed">わたした</button>`;
else a = `<button class="back" data-id="${id}" data-s="ready">もどす</button>`;
return `<div class="ord${fresh}"><div class="n">${esc(o.no)}</div><div class="q">${q}</div><div class="m">${esc(o.price)}円 ・ ${hhmm(o.createdAt)}</div><div class="acts">${a}</div></div>`;
}
const EMPTY = { new:"新しい注文はまだありません", ready:"できた注文はありません", handed:"まだありません" };
function renderAdmin(list){
const by = { new:[], ready:[], handed:[] };
list.forEach(o => (by[o.status] || by.new).push(o));
by.new.sort((a,b) => a.createdAt - b.createdAt); by.ready.sort((a,b) => a.createdAt - b.createdAt);
by.handed.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
for (const k in by){ $("l-"+k).innerHTML = by[k].length ? by[k].map(card).join("") : `<div class="empty">${EMPTY[k]}</div>`; $("c-"+k).textContent = by[k].length; }
const sum = f => list.reduce((a,o) => a + (o[f]||0), 0);
$("st-wait").innerHTML = by.new.length + "<small>件</small>";
$("st-tare").innerHTML = sum("tare") + "<small>本</small>";
$("st-shio").innerHTML = sum("shio") + "<small>本</small>";
$("st-cnt").innerHTML = list.length + "<small>件</small>";
$("st-sales").innerHTML = sum("price").toLocaleString() + "<small>円</small>";
list.forEach(o => seen.add(o.id));
}
document.querySelector(".cols").addEventListener("click", async e => {
const b = e.target.closest("button[data-id]"); if (!b) return; b.disabled = true;
try { await Store.setStatus(b.dataset.id, b.dataset.s); } catch(err){ $("adm-note").textContent = "更新できませんでした。"; b.disabled = false; }
});
$("b-reset").onclick = async () => {
if (!confirm("すべての注文を削除し、番号を1から始め直します。\n集計を保存していない場合は、先に「集計を保存」を押してください。\n\nリセットしてよろしいですか？")) return;
$("b-reset").disabled = true;
try { await Store.reset(); $("adm-note").textContent = "リセットしました。"; } catch(e){ $("adm-note").textContent = "リセットできませんでした。"; }
$("b-reset").disabled = false;
};
$("go-order").onclick = () => { location.href = "index.html"; };
const live = (on, t) => { $("live").classList.toggle("on", on); $("live-t").textContent = t; };
live(false, "接続中…");
Store.onOrders(list => { renderAdmin(list); if (list.length) firstLoad = false; });
Store.init((on, t) => { live(on, t); setTimeout(() => { firstLoad = false; }, 0); }).catch(() => live(false, "読み込みに失敗しました。通信を確認してください"));
let current = [];
Store.onOrders(list => { current = list; });
const STATUS = { new:"つくる", ready:"できた", handed:"わたした" };
const pad = n => String(n).padStart(2,"0");
function csvCell(v){ const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function buildCsv(list){
const now = new Date(), rows = [];
const sum = f => list.reduce((a,o) => a + (o[f]||0), 0);
const handed = list.filter(o => o.status === "handed").length;
rows.push(["やきとり 売上集計"]);
rows.push(["出力日時", `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`]);
rows.push([]);
rows.push(["■ 合計"]);
rows.push(["注文件数", list.length]);
rows.push(["タレ（本）", sum("tare")]);
rows.push(["しお（本）", sum("shio")]);
rows.push(["合計本数（本）", sum("count")]);
rows.push(["売上（円）", sum("price")]);
rows.push(["受け渡し済み（件）", handed]);
rows.push(["未受け渡し（件）", list.length - handed]);
rows.push([]);
rows.push(["■ 時間帯別"]);
rows.push(["時間帯", "注文件数", "タレ（本）", "しお（本）", "売上（円）"]);
const hours = {};
list.forEach(o => { const h = new Date(o.createdAt).getHours(); const r = hours[h] ||= { c:0, t:0, s:0, p:0 }; r.c++; r.t += o.tare||0; r.s += o.shio||0; r.p += o.price||0; });
Object.keys(hours).map(Number).sort((a,b) => a-b).forEach(h => { const r = hours[h]; rows.push([`${h}:00〜${h}:59`, r.c, r.t, r.s, r.p]); });
rows.push([]);
rows.push(["■ 注文一覧"]);
rows.push(["番号", "注文時刻", "タレ（本）", "しお（本）", "本数", "金額（円）", "状態"]);
[...list].sort((a,b) => a.createdAt - b.createdAt).forEach(o => {
const d = new Date(o.createdAt);
rows.push([o.no, `${pad(d.getHours())}:${pad(d.getMinutes())}`, o.tare||0, o.shio||0, o.count||0, o.price||0, STATUS[o.status] || o.status]);
});
return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
$("b-csv").onclick = () => {
if (!current.length){ $("adm-note").textContent = "まだ注文がありません。"; return; }
const d = new Date();
const name = `やきとり集計_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
const url = URL.createObjectURL(new Blob([buildCsv(current)], { type: "text/csv;charset=utf-8" }));
const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
setTimeout(() => URL.revokeObjectURL(url), 1000);
$("adm-note").textContent = name + " を保存しました。Excelで開いて印刷できます。";
};
const ST_KEY = { "つくる":"new", "できた":"ready", "わたした":"handed", new:"new", ready:"ready", handed:"handed" };
const loadXlsx = () => window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, ng) => {
const s = document.createElement("script");
s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
s.onload = () => ok(window.XLSX); s.onerror = ng; document.head.appendChild(s);
});
const int = v => { const n = Number(v); return Number.isInteger(n) ? n : NaN; };
function parseRestore(XLSX, buf){
const wb = XLSX.read(buf, { type:"array" });
const ws = wb.Sheets["注文一覧"]; if (!ws) throw new Error("「注文一覧」シートがありません");
const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
const col = Object.fromEntries(rows[0].map((h, i) => [h, i]));
if (!("id" in col)) throw new Error("復元用の列がありません。自動保存されたExcelを選んでください");
const ok = [], bad = [];
rows.slice(1).forEach(r => {
if (r.every(v => v === "")) return;
const tare = int(r[2]), shio = int(r[3]), no = int(r[0]), createdAt = int(r[col.createdAt]);
const o = { id: String(r[col.id]), no, tare, shio, count: tare + shio, price: int(r[5]), status: ST_KEY[r[6]], createdAt };
const valid = o.id && no > 0 && tare >= 0 && tare <= MAX && shio >= 0 && shio <= MAX && o.count > 0 && o.price >= 0 && o.status && createdAt > 0;
(valid ? ok : bad).push(valid ? o : r[0]);
});
return { ok, bad };
}
$("b-restore").onclick = () => $("f-restore").click();
$("f-restore").onchange = async e => {
const file = e.target.files[0]; e.target.value = ""; if (!file) return;
const note = $("adm-note"); note.textContent = "読み込み中…";
try {
const { ok, bad } = parseRestore(await loadXlsx(), await file.arrayBuffer());
const have = new Set(current.map(o => o.id));
const add = ok.filter(o => !have.has(o.id));
if (!add.length){ note.textContent = `復元する注文はありません（${ok.length}件はすべて登録済み）。`; return; }
const sum = add.reduce((a, o) => a + o.price, 0);
if (!confirm(`${file.name} から ${add.length}件（${sum.toLocaleString()}円）の注文を復元します。` +
(ok.length - add.length ? `\nすでにある ${ok.length - add.length}件は飛ばします。` : "") +
(bad.length ? `\n読めなかった行 ${bad.length}件は飛ばします。` : "") + "\n\nよろしいですか？")){ note.textContent = ""; return; }
$("b-restore").disabled = true;
await Store.restore(add);
note.textContent = `${add.length}件の注文を復元しました。` + (bad.length ? `（読めなかった行：番号 ${bad.join("、")}）` : "");
} catch(err){
note.textContent = "復元できませんでした：" + (err.message || "ファイルを確認してください");
}
$("b-restore").disabled = false;
};</script>
